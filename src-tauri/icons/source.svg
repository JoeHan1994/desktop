<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景紫色渐变（Fluent 深紫 → 紫罗兰） -->
    <linearGradient id="bg" x1="160" y1="120" x2="880" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C1D95"/>
      <stop offset="0.5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- 顶部高光 -->
    <linearGradient id="bgGloss" x1="512" y1="96" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 工具箱箱体渐变 -->
    <linearGradient id="boxBody" x1="300" y1="470" x2="724" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <!-- 箱盖渐变 -->
    <linearGradient id="boxLid" x1="300" y1="360" x2="724" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- 提手渐变 -->
    <linearGradient id="handle" x1="512" y1="250" x2="512" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- 中央徽标渐变 -->
    <linearGradient id="badge" x1="450" y1="560" x2="574" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <!-- 投影 -->
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#2E1065" flood-opacity="0.45"/>
    </filter>
    <filter id="lidShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="96" y="96" width="832" height="832" rx="200" fill="url(#bg)"/>
  <!-- 顶部光泽层 -->
  <rect x="96" y="96" width="832" height="832" rx="200" fill="url(#bgGloss)"/>
  <!-- 内描边（Fluent 边缘发光） -->
  <rect x="112" y="112" width="800" height="800" rx="184" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- 工具箱提手 -->
  <path d="M406 388V330c0-58.5 47.5-106 106-106s106 47.5 106 106v58"
        stroke="url(#handle)" stroke-width="42" stroke-linecap="round"/>
  <path d="M406 388V330c0-58.5 47.5-106 106-106s106 47.5 106 106v58"
        stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>

  <!-- 工具箱箱体 -->
  <g filter="url(#softShadow)">
    <rect x="248" y="446" width="528" height="348" rx="56" fill="url(#boxBody)"/>
  </g>

  <!-- 工具箱箱盖 -->
  <g filter="url(#lidShadow)">
    <rect x="224" y="392" width="576" height="150" rx="52" fill="url(#boxLid)"/>
  </g>
  <!-- 箱盖高光 -->
  <rect x="248" y="410" width="528" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- 中央圆形徽标（工具符号 —— 十字螺丝刀 + 扳手抽象） -->
  <circle cx="512" cy="632" r="86" fill="url(#badge)"/>
  <circle cx="512" cy="632" r="86" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
  <!-- 扳手/工具抽象符号 -->
  <path d="M512 578l14 28 30 4-22 22 6 30-28-15-28 15 6-30-22-22 30-4z"
        fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- 箱体底部分隔高光 -->
  <path d="M272 720h480" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round"/>
</svg>
