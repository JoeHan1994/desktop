[package]
name = "mytoolbox"
version = "0.1.0"
description = "MyToolBox desktop application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "window-unmaximize", "window-minimize", "window-start-dragging", "window-close", "window-maximize", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
mysql = "25"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
toml = "0.8"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
russh         = "0.44"
russh-keys    = "0.44"
russh-sftp    = "2.0"
async-trait   = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.48", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
