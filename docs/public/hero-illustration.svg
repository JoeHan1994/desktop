<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e3a5f" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background decorative circles -->
  <circle cx="400" cy="60" r="80" fill="#3b82f6" opacity="0.04"/>
  <circle cx="60" cy="340" r="60" fill="#6366f1" opacity="0.05"/>
  <circle cx="440" cy="350" r="40" fill="#38bdf8" opacity="0.04"/>

  <!-- ── Main dashboard card ─────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="400" height="240" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <!-- Title bar -->
  <rect x="40" y="30" width="400" height="44" rx="16" fill="#3b82f6" fill-opacity="0.08"/>
  <rect x="40" y="58" width="400" height="16" fill="#3b82f6" fill-opacity="0.08"/>
  <!-- Window dots -->
  <circle cx="64" cy="52" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="100" cy="52" r="5" fill="#22c55e" opacity="0.7"/>
  <!-- Title text -->
  <rect x="180" y="46" width="120" height="12" rx="3" fill="#94a3b8" opacity="0.4"/>

  <!-- ── VM Status rows ──────────────────────────────────────────── -->
  <!-- Row 1: Running -->
  <g transform="translate(60, 90)">
    <rect width="360" height="40" rx="8" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-opacity="0.15" stroke-width="1"/>
    <!-- VM icon -->
    <rect x="12" y="8" width="24" height="18" rx="3" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7"/>
    <rect x="16" y="28" width="16" height="4" rx="1" fill="#22c55e" opacity="0.4"/>
    <!-- Name -->
    <rect x="48" y="12" width="80" height="8" rx="2" fill="#64748b" opacity="0.5"/>
    <rect x="48" y="24" width="50" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <!-- Status badge -->
    <rect x="240" y="12" width="56" height="18" rx="9" fill="url(#greenGrad)" fill-opacity="0.15"/>
    <circle cx="254" cy="21" r="3" fill="#22c55e"/>
    <rect x="262" y="17" width="28" height="6" rx="2" fill="#22c55e" opacity="0.6"/>
    <!-- CPU bar -->
    <rect x="310" y="14" width="36" height="5" rx="2.5" fill="#e2e8f0" opacity="0.2"/>
    <rect x="310" y="14" width="24" height="5" rx="2.5" fill="url(#greenGrad)" opacity="0.6"/>
    <rect x="310" y="23" width="36" height="5" rx="2.5" fill="#e2e8f0" opacity="0.2"/>
    <rect x="310" y="23" width="14" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.5"/>
  </g>

  <!-- Row 2: Running -->
  <g transform="translate(60, 138)">
    <rect width="360" height="40" rx="8" fill="#3b82f6" fill-opacity="0.04" stroke="#3b82f6" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="12" y="8" width="24" height="18" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <rect x="16" y="28" width="16" height="4" rx="1" fill="#3b82f6" opacity="0.3"/>
    <rect x="48" y="12" width="100" height="8" rx="2" fill="#64748b" opacity="0.5"/>
    <rect x="48" y="24" width="60" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="240" y="12" width="56" height="18" rx="9" fill="url(#greenGrad)" fill-opacity="0.15"/>
    <circle cx="254" cy="21" r="3" fill="#22c55e"/>
    <rect x="262" y="17" width="28" height="6" rx="2" fill="#22c55e" opacity="0.6"/>
    <rect x="310" y="14" width="36" height="5" rx="2.5" fill="#e2e8f0" opacity="0.2"/>
    <rect x="310" y="14" width="30" height="5" rx="2.5" fill="url(#greenGrad)" opacity="0.6"/>
    <rect x="310" y="23" width="36" height="5" rx="2.5" fill="#e2e8f0" opacity="0.2"/>
    <rect x="310" y="23" width="20" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.5"/>
  </g>

  <!-- Row 3: Provisioning -->
  <g transform="translate(60, 186)">
    <rect width="360" height="40" rx="8" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="12" y="8" width="24" height="18" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <rect x="16" y="28" width="16" height="4" rx="1" fill="#f59e0b" opacity="0.3"/>
    <rect x="48" y="12" width="70" height="8" rx="2" fill="#64748b" opacity="0.5"/>
    <rect x="48" y="24" width="45" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <rect x="240" y="12" width="72" height="18" rx="9" fill="url(#amberGrad)" fill-opacity="0.15"/>
    <circle cx="254" cy="21" r="3" fill="#f59e0b" opacity="0.8"/>
    <rect x="262" y="17" width="42" height="6" rx="2" fill="#f59e0b" opacity="0.6"/>
    <!-- Progress bar instead of CPU -->
    <rect x="310" y="17" width="36" height="7" rx="3.5" fill="#e2e8f0" opacity="0.2"/>
    <rect x="310" y="17" width="18" height="7" rx="3.5" fill="url(#amberGrad)" opacity="0.6"/>
  </g>

  <!-- ── Floating test result card ───────────────────────────────── -->
  <g filter="url(#shadow)" transform="translate(20, 280)">
    <rect width="200" height="100" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Mini chart bars -->
    <rect x="20" y="70" width="16" height="16" rx="2" fill="url(#greenGrad)" opacity="0.5"/>
    <rect x="42" y="58" width="16" height="28" rx="2" fill="url(#greenGrad)" opacity="0.6"/>
    <rect x="64" y="50" width="16" height="36" rx="2" fill="url(#greenGrad)" opacity="0.7"/>
    <rect x="86" y="62" width="16" height="24" rx="2" fill="url(#amberGrad)" opacity="0.5"/>
    <rect x="108" y="44" width="16" height="42" rx="2" fill="url(#greenGrad)" opacity="0.7"/>
    <rect x="130" y="38" width="16" height="48" rx="2" fill="url(#accentGrad)" opacity="0.6"/>
    <rect x="152" y="54" width="16" height="32" rx="2" fill="url(#greenGrad)" opacity="0.6"/>
    <!-- Label -->
    <rect x="20" y="16" width="80" height="8" rx="2" fill="#94a3b8" opacity="0.5"/>
    <text x="20" y="38" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3b82f6" opacity="0.7">96.4% Pass</text>
  </g>

  <!-- ── Floating checkpoint card ────────────────────────────────── -->
  <g filter="url(#shadow)" transform="translate(250, 290)">
    <rect width="190" height="88" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Checkpoint icon (camera-like) -->
    <rect x="16" y="16" width="28" height="22" rx="4" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
    <circle cx="30" cy="27" r="6" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
    <!-- Checkpoint entries -->
    <rect x="56" y="16" width="100" height="7" rx="2" fill="#64748b" opacity="0.5"/>
    <rect x="56" y="28" width="70" height="6" rx="2" fill="#94a3b8" opacity="0.3"/>
    <!-- Timeline dots -->
    <circle cx="24" cy="52" r="4" fill="url(#accentGrad)" opacity="0.6"/>
    <line x1="28" y1="52" x2="44" y2="52" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="48" cy="52" r="4" fill="url(#accentGrad)" opacity="0.5"/>
    <line x1="52" y1="52" x2="68" y2="52" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="72" cy="52" r="4" fill="url(#accentGrad)" opacity="0.4"/>
    <line x1="76" y1="52" x2="92" y2="52" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="96" cy="52" r="4" fill="#94a3b8" opacity="0.2" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Restore label -->
    <rect x="56" y="66" width="56" height="7" rx="2" fill="#6366f1" opacity="0.3"/>
    <rect x="120" y="66" width="48" height="7" rx="2" fill="#94a3b8" opacity="0.2"/>
  </g>

  <!-- ── Decorative connection lines ─────────────────────────────── -->
  <line x1="240" y1="270" x2="240" y2="290" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="120" y1="270" x2="120" y2="280" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
